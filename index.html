<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>최신 영상 모음</title>
  <meta name="description" content="관심 채널의 새 영상을 한 곳에서 모아 봅니다.">

  <!-- 링크 공유 시 뜨는 미리보기 카드 (카톡·슬랙·트위터 등).
       크롤러는 상대경로를 못 읽는 곳이 많아 og:url·og:image는 절대주소로 쓴다.
       og:image는 SVG를 지원 안 하는 곳이 많아 PNG를 쓴다 (원본: og-image.svg). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="최신 영상 모음">
  <meta property="og:title" content="최신 영상 모음">
  <meta property="og:description" content="관심 채널의 새 영상을 한 곳에서 모아 봅니다.">
  <meta property="og:url" content="https://emithen.github.io/youtube-feed/">
  <meta property="og:image" content="https://emithen.github.io/youtube-feed/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="최신 영상 모음 — 관심 채널의 새 영상을 한 곳에서">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 탭 아이콘 (파일 없이 인라인 SVG로 처리) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234a90e2'/><path d='M40 30 L72 50 L40 70 Z' fill='white'/></svg>">

  <style>
    :root { color-scheme: light dark; }        /* 폰 다크모드 자동 대응 */
    body {
      font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
      max-width: 640px; margin: 0 auto; padding: 16px;
      line-height: 1.6;                          /* 줄 간격 -> 읽기 편하게 */
    }
    h1 { font-size: 1.5rem; margin-bottom: 2px; }
    h2 {                                         /* 채널 제목 왼쪽 색막대로 구분 */
      font-size: 1.05rem; margin: 26px 0 8px;
      padding-left: 8px; border-left: 4px solid #4a90e2;
    }
    p { margin: 7px 0; }
    a {                                          /* 링크 크고 굵게 -> 폰에서 누르기 쉬움 */
      font-size: 1.05rem; text-decoration: none;
      color: #4a90e2; font-weight: 600;
    }
    a:hover, a:active { text-decoration: underline; }
    small { color: #8a8a8a; }                   /* 날짜.시각은 은은하게 */

    /* ── 내 채널 추가 UI ── */
    .controls {
      border: 1px solid #8883; border-radius: 10px;
      padding: 10px 14px; margin: 14px 0 22px;
    }
    .controls summary { cursor: pointer; font-weight: 600; }
    #addForm { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    #addForm input {
      padding: 8px 10px; border: 1px solid #8886; border-radius: 8px;
      font-size: 1rem; background: transparent; color: inherit;
    }
    #addForm .row { display: flex; gap: 8px; }
    #addForm .row input { flex: 1; min-width: 0; }
    #addForm button {
      padding: 8px 14px; border: 0; border-radius: 8px;
      background: #4a90e2; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    #addForm button:disabled { opacity: .5; cursor: default; }
    .status { font-size: .9rem; color: #8a8a8a; min-height: 1em; }
    .hint { font-size: .8rem; color: #8a8a8a; margin: 8px 0 0; }
    .group {                                     /* "내 채널 / 추천 채널" 구분 라벨 */
      font-size: .8rem; color: #8a8a8a; letter-spacing: .04em; margin: 24px 0 0;
    }
    /* ── 랜덤 추천 ── */
    .pool {
      border: 1px solid #8883; border-radius: 10px;
      padding: 12px 14px; margin: 14px 0 22px;
    }
    .pool-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .pool .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pool button {
      padding: 8px 14px; border: 0; border-radius: 8px;
      background: #4a90e2; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
    }
    .pool button.ghost { background: transparent; color: #8a8a8a; border: 1px solid #8886; }
    .pool button:disabled { opacity: .5; cursor: default; }
    .pool input, .pool textarea {
      flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #8886; border-radius: 8px;
      font-size: 1rem; background: transparent; color: inherit; font-family: inherit;
    }
    .pool textarea { width: 100%; margin-bottom: 8px; }
    .pool .sub { margin-top: 14px; }
    .pool .sub summary { cursor: pointer; color: #8a8a8a; font-size: .9rem; }
    .lbl { display: block; margin: 12px 0 5px; font-size: .85rem; color: #8a8a8a; }
    #pick:not(:empty) {                          /* 뽑힌 영상 카드 */
      margin: 12px 0 4px; padding: 12px 14px;
      border-left: 4px solid #4a90e2; border-radius: 6px;
      background: color-mix(in srgb, #4a90e2 9%, transparent);
    }
    #pick .meta { display: block; margin-top: 4px; color: #8a8a8a; font-size: .85rem; }

    span.new {                                   /* 24시간 이내 업로드 표시 */
      display: inline-block; margin-right: 7px;
      padding: 1px 6px; border-radius: 5px;
      background: #4a90e2; color: #fff;
      font-size: .68rem; font-weight: 700; letter-spacing: .04em;
      vertical-align: 2px;
    }

    /* ── 본 영상 표시 ── */
    button.seen {                                /* 봤음 토글. 색만이 아니라 기호(✓/○)로도 구분 */
      margin-left: 8px; padding: 0 4px;
      font-size: .85rem; line-height: 1;
      background: transparent; border: 0; cursor: pointer;
      color: #8a8a8a; opacity: .55;
    }
    button.seen:hover { opacity: 1; }
    p.watched a {                                /* 본 영상은 흐리게 */
      opacity: .45; font-weight: 500;
    }
    p.watched small { opacity: .6; }
    p.watched button.seen { color: #4a90e2; opacity: .9; }

    button.del {                                 /* 채널 삭제 버튼 */
      margin-left: 10px; font-size: .75rem; font-weight: 500;
      color: #c0392b; background: transparent; border: 1px solid #c0392b55;
      border-radius: 6px; padding: 1px 8px; cursor: pointer; vertical-align: middle;
    }
  </style>
</head>
<body>
  <!-- 이 페이지는 "빈 껍데기"다.
       사용자가 추가한 채널을 localStorage에 저장하고, app.js가 Worker로 최신 영상을 받아 그린다.
       (추천 채널/data.json 경로는 2026-07-28에 화면에서 제거됨 — collect.py는 저장소에 보관 중) -->
  <h1>최신 영상 모음</h1>

  <details class="controls" open>
    <summary>＋ 내 채널 추가</summary>
    <form id="addForm">
      <input id="chInput" type="text"
             placeholder="채널 링크 / @핸들 / 채널ID(UC…)" required>
      <div class="row">
        <input id="chTopic" type="text" placeholder="주제(선택)">
        <input id="chName" type="text" placeholder="이름(선택)">
      </div>
      <button type="submit">추가</button>
      <span id="addStatus" class="status"></span>
    </form>
    <p class="hint">이 브라우저에만 저장돼요(localStorage). 계정 없이 이 기기에서만 보입니다.</p>
  </details>

  <!-- 나중에 볼 풀: ① 유튜브 "나중에 볼"에서 뽑아온 ID를 가져오기(일회성)
                     ② watchme 재생목록 동기화(앞으로 담는 곳)  → 합쳐서 랜덤 추천 -->
  <section class="pool">
    <div class="pool-head">
      <strong>🎲 랜덤 추천</strong>
      <span id="poolCount" class="status"></span>
    </div>
    <div class="row">
      <button type="button" id="pickBtn">랜덤으로 하나</button>
      <button type="button" id="repickBtn" class="ghost" hidden>다시 뽑기</button>
    </div>
    <div id="pick"></div>

    <details class="sub">
      <summary>영상 채워넣기 / 설정</summary>

      <label class="lbl">watchme 재생목록 (앞으로 담는 곳)</label>
      <div class="row">
        <input id="plInput" type="text" placeholder="재생목록 ID 또는 URL (PL...)">
        <button type="button" id="syncBtn">동기화</button>
      </div>

      <label class="lbl">"나중에 볼"에서 뽑은 ID 가져오기 (일회성)</label>
      <textarea id="idsInput" rows="3" placeholder='["abc123","def456"] 또는 줄바꿈·쉼표로 구분'></textarea>
      <div class="row">
        <button type="button" id="importBtn">가져오기</button>
        <button type="button" id="clearBtn" class="ghost">풀 비우기</button>
      </div>
      <p id="poolStatus" class="status"></p>
    </details>
  </section>

  <div id="my"></div>       <!-- 내가 추가한 채널 -->

  <!-- ?v= 는 캐시 버스팅: app.js를 고칠 때마다 숫자를 올린다.
       그래야 새 index.html이 캐시된 옛 app.js를 쓰다 깨지는 사고(버전 불일치)가 안 난다. -->
  <script src="app.js?v=8"></script>
</body>
</html>
