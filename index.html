<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>최신 영상 모음</title>
  <meta name="description" content="관심 채널의 새 영상을 한 곳에서 모아 봅니다.">

  <!-- 링크 공유 시 뜨는 미리보기 카드 (카톡·슬랙·트위터 등).
       크롤러는 상대경로를 못 읽는 곳이 많아 og:url·og:image는 절대주소로 쓴다.
       og:image는 SVG를 지원 안 하는 곳이 많아 PNG를 쓴다 (원본: public/og-image.svg).
       ⚠️ 배포를 Vercel로 옮기면 이 두 절대주소를 새 도메인으로 바꿔야 한다. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="최신 영상 모음">
  <meta property="og:title" content="최신 영상 모음">
  <meta property="og:description" content="관심 채널의 새 영상을 한 곳에서 모아 봅니다.">
  <meta property="og:url" content="https://emithen.github.io/youtube-feed/">
  <meta property="og:image" content="https://emithen.github.io/youtube-feed/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="최신 영상 모음 — 관심 채널의 새 영상을 한 곳에서">
  <meta property="og:locale" content="ko_KR">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 탭 아이콘 (파일 없이 인라인 SVG로 처리) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234a90e2'/><path d='M40 30 L72 50 L40 70 Z' fill='white'/></svg>">

  <!-- 홈 화면에 추가했을 때 앱처럼 뜨게 (원본 SVG와 만드는 법: public/icons/icon.svg 주석 참고).
       ⚠️ 안드로이드와 iOS가 서로 다른 걸 본다:
          안드로이드 → manifest.json의 icons
          iOS       → manifest를 무시하고 **apple-touch-icon 하나만** 본다. 그래서 따로 건다.
       ⚠️ 서비스워커는 일부러 안 넣었다. 없어도 "홈 화면에 추가"와 아이콘은 정상 동작한다.
          (크롬의 자동 설치 배너만 안 뜬다) 오프라인 지원은 별건이라 기대치를 만들지 않는다.
       ⭐ 경로가 상대(icons/)에서 절대(/icons/)로 바뀌었다 — GitHub Pages는 /youtube-feed/
          하위에 있었지만 Vercel은 도메인 루트라서. public/ 안의 것은 그대로 루트로 나간다. -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4a90e2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="영상모음">
</head>
<body>
  <!-- ⭐ 여기 있던 화면 넷의 마크업이 전부 사라졌다 — 이제 React가 만든다.
       예전엔 네 화면을 HTML에 다 그려두고 `hidden`으로 숨겼다. wire* 함수들이
       getElementById로 요소를 잡았기 때문에 **DOM에 남아 있어야만** 동작했다.
       React는 상태에서 화면을 만들므로 그 제약이 없어졌다.

       ⭐ 캐시 버스팅(?v=NN)도 통째로 사라졌다. 손으로 맞출 곳이 여섯이었고
          옛 index.html에 "더 늘면 그게 **빌드 단계를 들일 신호**다"라고 적어뒀는데,
          그 신호가 켜져서 들인 것이 Vite다. 이제 번들러가 파일명에 해시를 박는다. -->
  <div id="root"></div>

  <!-- 구글 로그인(GIS). async라 버튼을 누른 시점에 아직 안 왔을 수 있어
       youtube.ts의 ensureClient()가 최대 2초 기다린다. -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
