# 이 워크플로는 지금 "정적 파일 배포"만 한다.
# 2026-07-28: 추천 채널(data.json) 기능을 화면에서 뺐으므로 수집도 멈췄다.
#  - cron: 껐다 (안 쓰는 데이터를 3시간마다 모을 이유가 없음)
#  - collect.py 실행: 껐다
# 2026-07-31: collect.py·data.json 파일 자체를 지웠다(작업 폴더 정리).
#  되살리려면 아래 주석(#)을 푸는 것만으로는 안 되고, git 이력에서 파일부터 꺼내야 한다:
#    git log --diff-filter=D --oneline -- collect.py   ← 지운 커밋 찾기
#    git show <그 커밋>^:collect.py > collect.py

name: publish

on:
  push:
    branches: [main]         # main에 코드 push하면 즉시 배포
                             # (발행 대상인 gh-pages push는 트리거 안 됨 → 무한루프 방지)
  # schedule:
  #   - cron: "0 */3 * * *"   # 3시간마다 (UTC 기준) — 추천 채널 수집용. 지금은 중단.
  workflow_dispatch:         # 지금 실행 버튼용

permissions:
  contents: write            # gh-pages 브랜치에 커밋 권한

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 추천 채널 수집 (중단됨). 되살리려면 아래 두 스텝의 주석을 푼다.
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.12"
      #
      # - run: python collect.py

      - name: publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
